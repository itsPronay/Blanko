name: PR checks

# Every pull request must build and pass its tests on Windows, Linux and macOS.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
          - name: macOS (Apple silicon)
            os: macos-latest
          - name: macOS (Intel)
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Compiles all modules, runs :desktop-audio and :shared (desktop) tests, and builds the
      # runnable app image with jpackage. That image is what the installers are made from, so it
      # catches packaging problems without needing WiX/rpmbuild on the PR runners.
      - name: Build, test and package
        shell: bash
        run: ./gradlew assemble check :desktopApp:createDistributable --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ runner.os }}-${{ runner.arch }}
          path: "**/build/reports/tests/"
          if-no-files-found: ignore

  # One stable check name to mark as "required" in the branch protection rules.
  all-platforms:
    name: All platforms build
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        env:
          RESULT: ${{ needs.build.result }}
        run: |
          echo "Build result: $RESULT"
          [ "$RESULT" = "success" ]
