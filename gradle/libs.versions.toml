[versions]
kotlin = "2.1.0"
ksp = "2.1.0-1.0.28"
composeMultiplatform = "1.7.3"
coroutines = "1.9.0"
koin = "4.0.0"
# JetBrains' multiplatform builds of the AndroidX lifecycle / navigation libraries.
jetbrainsLifecycle = "2.8.4"
jetbrainsNavigation = "2.8.0-alpha10"
room = "2.8.4"
sqlite = "2.6.0"
datastore = "1.1.1"
okio = "3.9.1"
jcodec = "0.2.5"
jlayer = "1.0.1.4"
vorbisSpi = "1.2.1"
junit = "4.13.2"

[libraries]
# Kotlin / coroutines
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# Multiplatform AndroidX
jetbrains-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "jetbrainsLifecycle" }
jetbrains-navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "jetbrainsNavigation" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }


# Desktop audio
jcodec = { module = "org.jcodec:jcodec", version.ref = "jcodec" }
jlayer = { module = "com.googlecode.soundlibs:jlayer", version.ref = "jlayer" }
vorbis-spi = { module = "com.github.trilarion:java-vorbis-support", version.ref = "vorbisSpi" }

# Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
google-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
